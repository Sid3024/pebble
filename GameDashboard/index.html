<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pebble Garden</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>

<!-- ── Main scene ─────────────────────────────────────────── -->
<div id="scene">

  <!-- Clouds -->
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <!-- Header row -->
  <div id="header">
    <div id="title">🌸 Pebble Garden</div>
    <div id="status-area">
      <div id="pod-count">No pods connected</div>
      <div id="status-badge" class="waiting">Ready</div>
    </div>
  </div>

  <!-- Single-mode progress bar (hidden in competitive mode) -->
  <div id="progress-wrap">
    <div id="progress-label">Garden: 0%</div>
    <div id="progress-track">
      <div id="progress-fill"></div>
    </div>
  </div>

  <!-- Background trees — always visible -->
  <div id="trees-bg"></div>

  <!-- Single-mode flower garden -->
  <div id="garden"></div>

  <!-- Competitive-mode split view (shown via #scene.competitive class) -->
  <div id="competitive-view">
    <div class="team-panel" id="team-panel-0">
      <div class="team-header">
        <div class="team-label" id="team-label-0">Team 1</div>
        <div class="team-progress-wrap">
          <div class="team-progress-label" id="team-progress-label-0">0%</div>
          <div class="team-progress-track">
            <div class="team-progress-fill" id="team-progress-fill-0"></div>
          </div>
        </div>
      </div>
      <div class="team-garden" id="garden-0"></div>
    </div>

    <div class="team-divider"></div>

    <div class="team-panel" id="team-panel-1">
      <div class="team-header">
        <div class="team-label" id="team-label-1">Team 2</div>
        <div class="team-progress-wrap">
          <div class="team-progress-label" id="team-progress-label-1">0%</div>
          <div class="team-progress-track">
            <div class="team-progress-fill" id="team-progress-fill-1"></div>
          </div>
        </div>
      </div>
      <div class="team-garden" id="garden-1"></div>
    </div>
  </div>

</div>

<!-- ── Waiting / Start overlay ────────────────────────────── -->
<div id="waiting-overlay">
  <div id="waiting-title">🌱 Pebble Garden</div>
  <div id="waiting-sub">Pick up your pods and get ready to grow!</div>

  <div id="mode-select">
    <button class="mode-btn active" id="btn-mode-single">Single Team</button>
    <button class="mode-btn" id="btn-mode-competitive">Multiplayer</button>
  </div>

  <button id="btn-start">Start Session</button>
  <button id="lang-toggle" title="Switch language / 切换语言">中文</button>
</div>

<!-- ── Team selection overlay (competitive only) ─────────── -->
<div id="team-select-overlay">
  <div id="ts-title">Team 1 — Join Up! 🔵</div>
  <div id="ts-subtitle">Shake your weights to join Team 1!</div>

  <div id="ts-cards">
    <div class="ts-card" id="ts-card-0">
      <div class="ts-card-name" id="ts-card-name-0">Team 1</div>
      <div class="ts-count" id="ts-count-0">0</div>
      <div class="ts-card-label" id="ts-card-label-0">shaking in</div>
    </div>
    <div class="ts-card" id="ts-card-1">
      <div class="ts-card-name" id="ts-card-name-1">Team 2</div>
      <div class="ts-count" id="ts-count-1">0</div>
      <div class="ts-card-label" id="ts-card-label-1">waiting…</div>
    </div>
  </div>

  <button id="btn-next-team">Next: Team 2 →</button>
  <button id="btn-begin-game">Let's Play! 🌸</button>
</div>

<!-- ── Win overlay ────────────────────────────────────────── -->
<div id="win-overlay">
  <div id="win-title">🌸 Full Bloom! 🌸</div>
  <div id="win-sub">Amazing work — the garden is complete!</div>
  <button id="btn-reset">Play Again</button>
</div>

<!-- ── Facilitator shortcut ───────────────────────────────── -->
<div id="facilitator-start" title="Start a new session">▶ Start session</div>

<!-- ── Connection indicator ───────────────────────────────── -->
<div id="conn-dot" title="WebSocket connection"></div>

<script src="static/game.js"></script>
</body>
</html>
