; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed-xiao-esp32-s3-plus]
platform = espressif32@6.11.0
platform_packages =
	platformio/framework-arduinoespressif32@~3.20008.0
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
framework = arduino
; --- Upload fixes for XIAO ESP32-S3 USB-CDC ---
; Prevents the "No serial data received" error caused by esptool jumping to
; 460800 baud after the stub loads. 115200 avoids the baud-rate switch entirely.
upload_speed = 115200
build_flags = -I src
extra_scripts = pre:scripts/patch_freertos_stats.py
lib_deps =
	olikraus/U8g2@^2.36.5
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/Seeed-Studio/Seeed_Arduino_LIS3DHTR
