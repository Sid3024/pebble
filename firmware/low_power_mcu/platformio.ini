[env:seeed-xiao-nrf52840]
platform  = nordicnrf52
board     = seeed_xiao_nrf52840   ; use seeed_xiao_nrf52840_sense for Sense variant
framework = arduino

upload_speed  = 115200
monitor_speed = 115200

build_flags =
    -I src

; ArduinoBLE is NOT used here — the nordicnrf52 platform bundles the
; Adafruit nRF52 Arduino core which includes Bluefruit52 for BLE.
; Adding ArduinoBLE causes a dependency conflict and hangs resolution.
lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_LIS3DHTR.git

; Shared hardware-independent libraries (sensor, scoring, protocol)
; Disable platform-compatibility filtering so Arduino libraries (e.g. LIS3DHTR)
; that don't explicitly list nordicnrf52 can still be used.
lib_compat_mode = off

lib_extra_dirs  = ../shared
