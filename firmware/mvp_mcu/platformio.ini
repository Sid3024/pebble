[env:seeed-xiao-esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3   ; use seeed_xiao_esp32s3sense for Sense variant
framework = arduino

upload_speed  = 115200
monitor_speed = 115200

build_flags =
    -I src
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    Seeed Studio/Seeed_Arduino_LIS3DHTR @ ^1.2.3

; Shared hardware-independent libraries (sensor, scoring, protocol)
lib_extra_dirs = ../shared
